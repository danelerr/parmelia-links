[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
# Pin the exact compiler: every future CREATE2 address derives from this
# bytecode. The testnet addresses produced with 0.8.28 remain historical
# deployments; changing this value requires a new manifest and redeploy.
# 0.8.34 is the first release containing the via-IR transient-storage fix.
solc = "0.8.34"
via_ir = true
evm_version = "cancun"
optimizer = true
# The optimizer MUST stay ON: without it AccountWebAuthnV2 compiles to 24,988
# bytes, over the 24,576-byte EIP-170 limit (enforced on Arbitrum and every chain
# we may port to). With it on, a high runs count favors runtime gas - the impl is
# delegatecalled on every UserOp - while staying well under the limit (~15 KB).
# Keep this value FIXED so CREATE2 yields identical addresses across Sepolia/One.
optimizer_runs = 1000000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
