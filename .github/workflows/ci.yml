name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VITE_FIREBASE_API_KEY: ci-not-a-secret
  VITE_FIREBASE_AUTH_DOMAIN: localhost
  VITE_FIREBASE_PROJECT_ID: gatopago-ci
  VITE_FIREBASE_STORAGE_BUCKET: gatopago-ci.invalid
  VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  VITE_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000
  VITE_CHAIN_KEY: arbitrum-sepolia
  VITE_SERVER_URL: https://server.example.invalid

jobs:
  verify:
    name: Quality, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Solidity dependencies
        working-directory: contracts
        run: >-
          forge install --no-git --shallow
          forge-std=foundry-rs/forge-std@rev=bf647bd6046f2f7da30d0c2bf435e5c76a780c1b
          openzeppelin-contracts=OpenZeppelin/openzeppelin-contracts@rev=cab19933c33c2ad1d4c7a84864a3601dddfd16f3

      - name: Run deterministic release verification
        run: pnpm verify:ci

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
