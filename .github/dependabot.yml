version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/La_Paz
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      compatible-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/La_Paz
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
